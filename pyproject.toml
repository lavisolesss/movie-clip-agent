[project]
name = "movie-agent"
version = "0.1.0"
description = "Discord 影視片段查詢 agent：用 claude -p 從截圖或台詞找出作品名稱，記進 Excel"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord-py>=2.7.1",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.4",
]

[project.scripts]
movie-agent = "movie_agent.main:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
